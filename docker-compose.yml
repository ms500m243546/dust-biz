# DustOps AI - Phase B.5 minimal compose.
# Backend only. Postgres / TimescaleDB and frontend service land in
# later phases (Phase C for ingestion-ready storage, Phase J for UI).

services:
  api:
    build: .
    image: dustops-ai-api:dev
    container_name: dustops-api
    ports:
      - "8000:8000"
    environment:
      DUSTOPS_LOG_LEVEL: INFO
      # Default to in-container SQLite; switch to Postgres URL when the
      # db service lands.
      DUSTOPS_DATABASE_URL: sqlite:////tmp/dustops.db
    restart: unless-stopped
