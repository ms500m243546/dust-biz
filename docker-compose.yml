# DustOps AI compose. Backend (Phase B+) and dashboard (Phase J).
# Postgres / TimescaleDB swap deferred to Phase K per architecture swap criteria.

services:
  api:
    build: .
    image: dustops-ai-api:dev
    container_name: dustops-api
    ports:
      - "8000:8000"
    environment:
      DUSTOPS_LOG_LEVEL: INFO
      DUSTOPS_DATABASE_URL: sqlite:////tmp/dustops.db
    restart: unless-stopped

  web:
    image: node:20-alpine
    container_name: dustops-web
    working_dir: /app
    volumes:
      - ./web:/app
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    depends_on:
      - api
    profiles: ["dev"]
