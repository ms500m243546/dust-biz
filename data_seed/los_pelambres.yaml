# Los Pelambres — RCA-derived seed data
#
# Mine: Minera Los Pelambres (operator: Antofagasta Minerals).
# Region / commune: Coquimbo / Salamanca.
# Original RCA: Resolución 38/1997, Comisión Regional del Medio
# Ambiente IV Región. See docs/rca-seed.md for the full provenance
# (El Mauro tailings consent, Caimanes case, supreme court rulings).
#
# Values marked `TODO_FROM_RCA` must be sourced from the actual RCA
# PDFs on sea.gob.cl before this seed is loaded into a deployment
# environment. The validate-rca-seed gate fails on TODO_FROM_RCA when
# DUSTOPS_DEPLOYMENT_TIER=production.

deployment_tier: dev  # one of {dev, staging, production}

mine:
  mine_id: los-pelambres
  name: Minera Los Pelambres
  default_automation_level: L1

# Approximate pit centroid in WGS84 lon/lat. Replace with surveyed
# values when partner data lands.
mine_centroid:
  longitude: -70.5208
  latitude: -31.7300

site_config:
  site_id: los-pelambres-site
  mine_id: los-pelambres
  automation_level: L1
  # Chilean primary norms (D.S. 12/2011, MMA): PM10 24h 150 µg/m³,
  # annual 50; PM2.5 24h 50 µg/m³, annual 20. Site default mirrors the
  # daily breach norm; per-station overrides below tighten where the
  # RCA mandates.
  pm10_thresholds:
    warning: 100.0
    breach: 150.0
  pm25_thresholds:
    warning: 25.0
    breach: 50.0
  extreme_breach_threshold: 0.85
  low_confidence_threshold: 0.5
  approval_expiry_minutes: 15
  optimization_weights:
    w_breach: 1.0
    w_production: 1.0
    w_disruption: 0.5
    w_low_confidence: 0.5
    w_compliance: 1.0
  cost_curves:
    tonne_value_usd: 80.0
    intervention_unit_costs_usd: {}

# Populated places + sensitive receptors mentioned in the Los Pelambres
# RCAs and the Caimanes / El Mauro case file. Distance + bearing are
# computed by the loader from the mine centroid.
populated_places:
  - place_id: lp-cuncumen
    name: Cuncumén
    kind: town
    longitude: -70.7010
    latitude: -31.9710
    population: 600
    source: rca_receptor_list
    source_url: https://sea.gob.cl/  # TODO_FROM_RCA: specific RCA URL
    notes: Community monitoring receptor, Salamanca commune.
  - place_id: lp-caimanes
    name: Caimanes
    kind: town
    longitude: -71.1350
    latitude: -32.0200
    population: 1300
    source: rca_receptor_list
    source_url: https://sea.gob.cl/  # TODO_FROM_RCA
    notes: Downstream of El Mauro tailings dam; subject of the
      Caimanes drinking-water supreme court case.
  - place_id: lp-salamanca
    name: Salamanca
    kind: town
    longitude: -70.9670
    latitude: -31.7780
    population: 25000
    source: rca_receptor_list
    source_url: https://sea.gob.cl/  # TODO_FROM_RCA
    notes: Comuna seat; regional reference station.
  - place_id: lp-el-manzano
    name: El Manzano
    kind: town
    # BB.7: coordinates from OSM place=village + Salamanca commune
    # cadastre. Approximate; verify via INE census export before
    # promoting deployment_tier above `dev`.
    longitude: -70.6200
    latitude: -31.8500
    population: 200
    coordinate_source: approximate; verify via INE
    source: rca_receptor_list
    source_url: https://sea.gob.cl/  # TODO_FROM_RCA
    notes: Small community downstream of mine area.
  - place_id: lp-chillepin
    name: Chillepín
    kind: town
    # BB.7: Choapa valley downstream of pit. Approximate; verify via INE.
    longitude: -70.6500
    latitude: -31.9500
    population: 400
    coordinate_source: approximate; verify via INE
    source: rca_receptor_list
    source_url: https://sea.gob.cl/  # TODO_FROM_RCA
    notes: Choapa valley community.
  - place_id: lp-coiron
    name: Coirón
    kind: town
    # BB.7: Salamanca commune. Approximate; verify via INE.
    longitude: -70.9100
    latitude: -31.8100
    population: 200
    coordinate_source: approximate; verify via INE
    source: rca_receptor_list
    source_url: https://sea.gob.cl/  # TODO_FROM_RCA

# Sensors (compliance + faena monitoring stations). Each station also
# gets a row in `station_threshold_overrides` below so the K.2 +
# K.6 reports honor the RCA-mandated limit.
#
# SINCA station codes + region paths verified against
# sinca.mma.gob.cl on 2026-05-02 (see scripts/seed_public_data.py).
# All Choapa-province stations live under SINCA region path "RIV"
# (Coquimbo). Stations marked `sinca_station_code: null` are
# operator-private (Antofagasta telematics) and require the
# operator_real adapter rather than the SINCA orchestrator.
sensors:
  # --- SINCA-public community + regional receptors ---
  #
  # `sinca_data_status` field (added 2026-05-02 after empirical batch
  # probe of the SINCA portal):
  #
  #   has_data            station publishes real PM10 readings via
  #                       SINCA's tsindico2.cgi gateway
  #   no_published_data   station is registered with SINCA and has the
  #                       macropath schema, but the data files are
  #                       empty across multi-year windows (likely a
  #                       paper-compliance station whose data flows
  #                       through SMA/SEIA filings or operator audits
  #                       rather than the public portal)
  #
  # Status determined by hitting `outtype=xcl` for each station with
  # a 1+ year window and counting non-empty value rows.
  #
  # `sinca_resolution`: "horario" (hourly, EMRPM-grade) or "diario"
  # (24-hr filter sampler). Cuncumén is the only Choapa station with
  # hourly data.
  - sensor_id: lp-em05-cuncumen
    mine_id: los-pelambres
    sensor_type: pm10
    is_compliance_station: true
    sinca_station_code: "424"
    sinca_region_path: RIV
    sinca_resolution: horario
    sinca_data_status: has_data
    notes: Cuncumén community monitoring station (regulator-grade
      EMRPM). Salamanca commune. Verified 2026-05-02; PM10 from
      2012-04-01, PM2.5 from 2020-01-01. Only Choapa-province
      station with hourly resolution.
  - sensor_id: lp-caimanes
    mine_id: los-pelambres
    sensor_type: pm10
    is_compliance_station: true
    sinca_station_code: "407"
    sinca_region_path: RIV
    sinca_resolution: diario
    sinca_data_status: no_published_data
    notes: Caimanes community PM monitoring per RCA receptor list.
      Los Vilos commune; downstream of El Mauro tailings. SINCA
      registry has the schema but values are empty over 5+ year
      windows — actual readings likely flow through SMA SEIA reports
      rather than the public portal.
  - sensor_id: lp-coiron
    mine_id: los-pelambres
    sensor_type: pm10
    is_compliance_station: true
    sinca_station_code: "404"
    sinca_region_path: RIV
    sinca_resolution: diario
    sinca_data_status: no_published_data
    notes: Coirón community receptor (Salamanca commune). Maps to
      the lp-coiron populated place. Same empty-archive pattern as
      Caimanes.
  - sensor_id: lp-camisas
    mine_id: los-pelambres
    sensor_type: pm10
    is_compliance_station: true
    sinca_station_code: "405"
    sinca_region_path: RIV
    sinca_resolution: diario
    sinca_data_status: no_published_data
    notes: Camisas community receptor (Salamanca commune). Empty
      SINCA archive; awaiting alternate source.
  - sensor_id: lp-hotel-mina
    mine_id: los-pelambres
    sensor_type: pm10
    is_compliance_station: true
    sinca_station_code: "401"
    sinca_region_path: RIV
    sinca_resolution: diario
    sinca_data_status: no_published_data
    notes: Hotel Mina station (Salamanca commune). Empty SINCA archive.
  - sensor_id: lp-quelen-alto
    mine_id: los-pelambres
    sensor_type: pm10
    is_compliance_station: true
    sinca_station_code: "409"
    sinca_region_path: RIV
    sinca_resolution: diario
    sinca_data_status: no_published_data
    notes: Quelen Alto station (Salamanca commune). Empty SINCA archive.
  - sensor_id: lp-chacay
    mine_id: los-pelambres
    sensor_type: pm10
    is_compliance_station: true
    sinca_station_code: "402"
    sinca_region_path: RIV
    sinca_resolution: diario
    sinca_data_status: no_published_data
    notes: Chacay station (Los Vilos commune). Empty SINCA archive.
  - sensor_id: lp-punta-chungo
    mine_id: los-pelambres
    sensor_type: pm10
    is_compliance_station: true
    sinca_station_code: "408"
    sinca_region_path: RIV
    sinca_resolution: diario
    sinca_data_status: no_published_data
    notes: Punta Chungo station (Los Vilos commune). Empty SINCA archive.
  - sensor_id: lp-el-mauro
    mine_id: los-pelambres
    sensor_type: pm10
    is_compliance_station: true
    sinca_station_code: "406"
    sinca_region_path: RIV
    sinca_resolution: diario
    sinca_data_status: no_published_data
    notes: El Mauro station (Los Vilos commune). Co-located with the
      El Mauro tailings dam. Empty SINCA archive — operator-direct
      monitoring data likely available via Antofagasta partnership
      and/or SMA filings rather than the public portal.
  # --- Operator-private faena stations (Antofagasta partnership) ---
  - sensor_id: lp-pit-active
    mine_id: los-pelambres
    sensor_type: pm10
    is_compliance_station: false
    sinca_station_code: null
    notes: Active-pit faena station. Operator-private; no SINCA
      equivalent — depends on Antofagasta telematics feed
      (operator_real adapter).
  - sensor_id: lp-piuquenes
    mine_id: los-pelambres
    sensor_type: pm10
    is_compliance_station: false
    sinca_station_code: null
    notes: Piuquenes faena reference. Verified 2026-05-02 as
      NOT in SINCA; operator-private.

# Per-station threshold overrides. Los Pelambres RCAs reference the
# D.S. 12/2011 primary norms at receptor stations rather than imposing
# stricter site-specific values, so the receptors below mirror the
# site default — the value of the encoding is provenance + per-station
# audit trail, not numeric stringency. If a future RCA amendment
# tightens any of these, change the per-station number here without
# touching the site default.
station_threshold_overrides:
  - sensor_id: lp-em05-cuncumen
    pm10_warning_ugm3: 100.0
    pm10_breach_ugm3: 150.0
    pm25_warning_ugm3: 25.0
    pm25_breach_ugm3: 50.0
    rca_reference: RCA 38/1997 — Cuncumén community receptor
    source_url: https://sea.gob.cl/  # TODO_FROM_RCA
  - sensor_id: lp-caimanes
    pm10_warning_ugm3: 100.0
    pm10_breach_ugm3: 150.0
    pm25_warning_ugm3: 25.0
    pm25_breach_ugm3: 50.0
    rca_reference: RCA 050/2004 amendment — El Mauro / Caimanes consent
    source_url: https://sea.gob.cl/  # TODO_FROM_RCA
  - sensor_id: lp-coiron
    pm10_warning_ugm3: 100.0
    pm10_breach_ugm3: 150.0
    pm25_warning_ugm3: 25.0
    pm25_breach_ugm3: 50.0
    rca_reference: RCA 38/1997 — Coirón Choapa-valley receptor
    source_url: https://sea.gob.cl/  # TODO_FROM_RCA
  - sensor_id: lp-camisas
    pm10_warning_ugm3: 100.0
    pm10_breach_ugm3: 150.0
    pm25_warning_ugm3: 25.0
    pm25_breach_ugm3: 50.0
    rca_reference: RCA 38/1997 — Camisas community receptor
    source_url: https://sea.gob.cl/  # TODO_FROM_RCA
  - sensor_id: lp-hotel-mina
    pm10_warning_ugm3: 100.0
    pm10_breach_ugm3: 150.0
    pm25_warning_ugm3: 25.0
    pm25_breach_ugm3: 50.0
    rca_reference: RCA 38/1997 — Hotel Mina receptor
    source_url: https://sea.gob.cl/  # TODO_FROM_RCA
  - sensor_id: lp-quelen-alto
    pm10_warning_ugm3: 100.0
    pm10_breach_ugm3: 150.0
    pm25_warning_ugm3: 25.0
    pm25_breach_ugm3: 50.0
    rca_reference: RCA 38/1997 — Quelen Alto receptor
    source_url: https://sea.gob.cl/  # TODO_FROM_RCA
  - sensor_id: lp-chacay
    pm10_warning_ugm3: 100.0
    pm10_breach_ugm3: 150.0
    pm25_warning_ugm3: 25.0
    pm25_breach_ugm3: 50.0
    rca_reference: RCA 050/2004 — Chacay / Los Vilos receptor
    source_url: https://sea.gob.cl/  # TODO_FROM_RCA
  - sensor_id: lp-punta-chungo
    pm10_warning_ugm3: 100.0
    pm10_breach_ugm3: 150.0
    pm25_warning_ugm3: 25.0
    pm25_breach_ugm3: 50.0
    rca_reference: RCA 050/2004 — Punta Chungo / Los Vilos coastal receptor
    source_url: https://sea.gob.cl/  # TODO_FROM_RCA
  - sensor_id: lp-el-mauro
